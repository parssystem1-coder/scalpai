<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScalpAI - پلتفرم جامع تریکولوژی و آنالیز هوشمند پوست و مو</title>
    <meta name="description" content="پلتفرم جامع تریکولوژی، آنالیز پوست و مو، مدیریت پرونده بیماران و ثبت داده‌های کلینیکی" />
    <meta property="og:title" content="ScalpAI - پلتفرم جامع تریکولوژی و آنالیز هوشمند پوست و مو" />
    <meta property="og:description" content="پلتفرم جامع تریکولوژی، آنالیز پوست و مو، مدیریت پرونده بیماران و ثبت داده‌های کلینیکی" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#C9906A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 0;
        font-family: 'Vazirmatn', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #FAF7F2;
        color: #1A1614;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #C9906A44; border-radius: 2px; }

      @keyframes strand-flow {
        0%   { transform: translateX(-2%) translateY(0%) rotate(0deg) scaleX(1); opacity: 0.7; }
        25%  { transform: translateX(1%) translateY(-0.5%) rotate(0.3deg) scaleX(1.01); opacity: 0.9; }
        50%  { transform: translateX(-1%) translateY(-1%) rotate(-0.2deg) scaleX(0.99); opacity: 0.75; }
        75%  { transform: translateX(2%) translateY(0.5%) rotate(0.1deg) scaleX(1.01); opacity: 0.85; }
        100% { transform: translateX(-2%) translateY(0%) rotate(0deg) scaleX(1); opacity: 0.7; }
      }

      @keyframes dew-float {
        0%   { transform: translateY(0px) translateX(0px) scale(1); opacity: 0.9; }
        33%  { transform: translateY(-8px) translateX(4px) scale(1.05); opacity: 1; }
        66%  { transform: translateY(-3px) translateX(-5px) scale(0.97); opacity: 0.85; }
        100% { transform: translateY(0px) translateX(0px) scale(1); opacity: 0.9; }
      }

      @keyframes ring-pulse {
        0%   { transform: scale(0.9) rotate(0deg); opacity: 0; }
        20%  { opacity: 0.6; }
        60%  { transform: scale(1.4) rotate(180deg); opacity: 0.3; }
        100% { transform: scale(1.8) rotate(360deg); opacity: 0. }
      }

      @keyframes ring-spin {
        0%   { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes sparkle-pulse {
        0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
        40%       { transform: scale(1) rotate(45deg); opacity: 1; }
        70%       { transform: scale(0.6) rotate(90deg); opacity: 0.6; }
      }

      @keyframes shimmer-sweep {
        0%   { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      @keyframes fade-up {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes gradient-shift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes holo-drift {
        0%   { transform: translateX(0) translateY(0) rotate(0deg); opacity: 0.4; }
        25%  { transform: translateX(10px) translateY(-15px) rotate(90deg); opacity: 0.7; }
        50%  { transform: translateX(-5px) translateY(-25px) rotate(180deg); opacity: 0.3; }
        75%  { transform: translateX(-12px) translateY(-10px) rotate(270deg); opacity: 0.6; }
        100% { transform: translateX(0) translateY(0) rotate(360deg); opacity: 0.4; }
      }

      @keyframes text-shimmer {
        0%   { background-position: 0% center; }
        100% { background-position: 200% center; }
      }

      @keyframes neural-scan {
        0%   { transform: scaleX(0); opacity: 0; }
        10%  { opacity: 0.8; }
        90%  { opacity: 0.6; }
        100% { transform: scaleX(1); opacity: 0; }
      }

      @keyframes counter-spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(-360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
