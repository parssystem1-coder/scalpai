# ScalpAI v2 - local development stack (DESIGN-V2 s2/s14)
# Used by developers with Docker Desktop. Image tags are pinned and the
# Postgres major matches BOTH CI and ops/prod.yml (M17).
# Credentials here are dev_only on purpose and must never appear in prod.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: scalpai
      POSTGRES_PASSWORD: scalpai_dev_only
      POSTGRES_DB: scalpai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalpai -d scalpai"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scalpai
      MINIO_ROOT_PASSWORD: scalpai_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
