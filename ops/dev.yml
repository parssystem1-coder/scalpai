# ScalpAI v2 — local development stack (DESIGN-V2 §2/§14)
# Used by CI (ubuntu runners have docker) and by developers with Docker Desktop.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: scalpai
      POSTGRES_PASSWORD: scalpai_dev_only
      POSTGRES_DB: scalpai
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalpai -d scalpai"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: scalpai
      MINIO_ROOT_PASSWORD: scalpai_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
