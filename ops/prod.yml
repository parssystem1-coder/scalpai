# ScalpAI v2 — Self-Hosted Production Stack (DESIGN-V2 §14 / Slice P6)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-scalpai}:${POSTGRES_PASSWORD:-scalpai_secure_pwd}@postgres:5432/${POSTGRES_DB:-scalpai}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-scalpai-media}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-scalpai}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-scalpai_secure_pwd}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-scalpai}:${POSTGRES_PASSWORD:-scalpai_secure_pwd}@postgres:5432/${POSTGRES_DB:-scalpai}
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalpai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalpai_secure_pwd}
      POSTGRES_DB: ${POSTGRES_DB:-scalpai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalpai} -d ${POSTGRES_DB:-scalpai}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scalpai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scalpai_secure_pwd}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Automated periodic encrypted backups (Slice P6)
  backup-cron:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      sh -c '
        apk add --no-cache openssl gzip bash
        echo "0 2 * * * /scripts/backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        crond -f -l 2
      '
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-scalpai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-scalpai_secure_pwd}
      - POSTGRES_DB=${POSTGRES_DB:-scalpai}
      - DB_HOST=postgres
      - DB_PORT=5432
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:-scalpai_secure_backup_key}
      - BACKUP_DIR=/backups
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  redisdata:
  backups_data:
  caddy_data:
  caddy_config:
