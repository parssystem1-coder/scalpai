# ScalpAI v2 - Self-Hosted Production Stack (DESIGN-V2 s14 / ADR-0036 / ADR-0042)
#
# This is the ONE supported production topology: a single host running
# Caddy + web + api + postgres + minio + redis behind automatic TLS.
# Vercel is only ever used for a STATIC preview build of the web app
# (`npm run build:vercel`) - there is no Vercel deployment of the API.
#
# Run it:
#   cp ops/prod.env.template ops/prod.env && $EDITOR ops/prod.env
#   cd ops && docker compose -f prod.yml --env-file prod.env up -d --build
#
# Every secret below is REQUIRED: `${VAR:?...}` makes compose fail fast
# instead of silently booting the stack with a shared default password.
name: scalpai

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # A real, resolvable domain is mandatory: ACME cannot issue for :80.
      SCALPAI_DOMAIN: ${SCALPAI_DOMAIN:?SCALPAI_DOMAIN is required (e.g. clinic.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required for automatic TLS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  # One-shot schema owner. Runs as the OWNER role, applies every migration and
  # provisions the scalpai_app / scalpai_auth roles (ADR-0029), then exits.
  # The API waits for a successful exit - it can never race the schema.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    working_dir: /app
    command: ["npm", "run", "db:migrate"]
    restart: "no"
    environment:
      - NODE_ENV=production
      - MIGRATE_DATABASE_URL=postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Password the migration assigns to the runtime role; must match the one
      # the API connects with below.
      - APP_ROLE_PASSWORD=${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # Runtime connects as the least-privilege app role (NOSUPERUSER,
      # NOBYPASSRLS). The owner role is NEVER used at runtime (C8/R5).
      - DATABASE_URL=postgres://scalpai_app:${APP_ROLE_PASSWORD:?APP_ROLE_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      # Shared auth/rate-limit state - mandatory in production (ADR-0034).
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      - S3_FORCE_PATH_STYLE=true
      - STORAGE_DRIVER=s3
      - CORS_ALLOWED_ORIGINS=https://${SCALPAI_DOMAIN:?SCALPAI_DOMAIN is required}
      # The API reads exactly these names (ADR-0035). The previous key only
      # verifies, and only until JWT_SECRET_PREVIOUS_UNTIL passes.
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (32+ chars)}
      - JWT_SECRET_PREVIOUS=${JWT_SECRET_PREVIOUS:-}
      - JWT_SECRET_PREVIOUS_UNTIL=${JWT_SECRET_PREVIOUS_UNTIL:-}
      # Phase 9 (L3/ADR-0042): an install that cannot page anyone is not
      # operable, so the alert sink is a required decision, not a nice-to-have.
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:?ALERT_WEBHOOK_URL is required - a stack nobody can be paged about is not operable}
      - ALERT_MIN_SEVERITY=${ALERT_MIN_SEVERITY:-warning}
      # /api/v1/metrics stays closed unless a token is set (Prometheus scrape).
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      # Phase 9: no statement may pin a connection forever.
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - DB_STATEMENT_TIMEOUT_MS=${DB_STATEMENT_TIMEOUT_MS:-15000}
      - DB_IDLE_IN_TRANSACTION_TIMEOUT_MS=${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-15000}
      # Phase 9 (L4): global + per-clinic request budgets for every route.
      - RATE_LIMIT_DEFAULT_MAX=${RATE_LIMIT_DEFAULT_MAX:-600}
      - RATE_LIMIT_GLOBAL_MAX=${RATE_LIMIT_GLOBAL_MAX:-5000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    # SIGTERM drains in-flight requests (apps/api/src/main.ts).
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1536M

  postgres:
    # Major version is pinned AND identical to CI (.github/workflows/ci.yml).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Phase 9 (C10 / ADR-0042). Backs up PostgreSQL AND MinIO, encrypts with age
  # (AEAD), reads its secrets from mounted files, pushes an object-locked copy
  # off-site and pages on failure. There is no passphrase variable any more and
  # no default anywhere: a missing secret stops the service.
  backup-cron:
    build:
      context: ..
      dockerfile: ops/backup.Dockerfile
      args:
        # Same Postgres major as the database service and CI (M17).
        POSTGRES_IMAGE: postgres:17-alpine
        BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER is required}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB is required}
      - DB_HOST=postgres
      - DB_PORT=5432
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      # PUBLIC recipients only. The identity that can DECRYPT a snapshot never
      # lives on the host that writes it (ADR-0042). Absolute host path.
      - BACKUP_AGE_RECIPIENTS_FILE=${BACKUP_AGE_RECIPIENTS_FILE:?BACKUP_AGE_RECIPIENTS_FILE is required (absolute path to a mounted age recipients file)}
      # The media bucket is part of the clinical record, so it is in the backup.
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:?S3_BUCKET is required}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Off-site, object-locked (WORM) copy. A snapshot that only exists on this
      # host does not survive the event a backup exists for.
      - BACKUP_OFFSITE_ENDPOINT=${BACKUP_OFFSITE_ENDPOINT:?BACKUP_OFFSITE_ENDPOINT is required (https://s3.provider.example)}
      - BACKUP_OFFSITE_BUCKET=${BACKUP_OFFSITE_BUCKET:?BACKUP_OFFSITE_BUCKET is required (object locking MUST be enabled)}
      - BACKUP_OFFSITE_ACCESS_KEY=${BACKUP_OFFSITE_ACCESS_KEY:?BACKUP_OFFSITE_ACCESS_KEY is required}
      - BACKUP_OFFSITE_SECRET_KEY=${BACKUP_OFFSITE_SECRET_KEY:?BACKUP_OFFSITE_SECRET_KEY is required}
      - BACKUP_OFFSITE_RETENTION_DAYS=${BACKUP_OFFSITE_RETENTION_DAYS:-90}
      - BACKUP_OFFSITE_LOCK_MODE=${BACKUP_OFFSITE_LOCK_MODE:-COMPLIANCE}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:?ALERT_WEBHOOK_URL is required - a failed backup has to page someone}
    volumes:
      - ${BACKUP_AGE_RECIPIENTS_FILE:?BACKUP_AGE_RECIPIENTS_FILE is required}:${BACKUP_AGE_RECIPIENTS_FILE:?BACKUP_AGE_RECIPIENTS_FILE is required}:ro
      - backups_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  pgdata:
  miniodata:
  redisdata:
  backups_data:
  caddy_data:
  caddy_config:
