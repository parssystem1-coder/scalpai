name: Nightly

# The retry/mirror helper (tools/ci/retry.sh) falls back to this namespace's
# GHCR package when quay.io rejects anonymous pulls.
env:
  GHCR_MIRROR_OWNER: ${{ github.repository_owner }}

# H15: the FULL tagged Playwright suite (@smoke, @offline, @analysis,
# @upload-big, @perf) is too slow for every PR, so it runs here every night and
# on demand. Same evidence contract as CI (tools/ci/run-gate.sh) and the same
# npm-only rule (ADR-0036). A red nightly is a signal to fix the suite - never a
# reason to weaken the PR gate.
#
# Phase 9 (C10) adds the recovery drill: back up both stores, push the snapshot
# off-site, restore it into a scratch database and prove the rows are there. The
# drill re-reads its own evidence with the `drill` gate set, so a nightly that
# skipped a step cannot report success.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  # pulls of the private ghcr.io/<owner>/mirror-minio fallback images (synced
  # by mirror-images.yml; GHCR packages start private)
  packages: read

jobs:
  e2e-full:
    name: full Playwright suite on the real stack
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      API_PORT: "3001"
      WEB_PORT: "5173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Write the .env the API under test boots with
        run: |
          cat > .env <<'ENV'
          NODE_ENV=test
          PORT=3001
          MIGRATE_DATABASE_URL=postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
          DATABASE_URL=postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
          APP_ROLE_PASSWORD=scalpai_dev_only
          JWT_SECRET=ci_dev_only_secret_0123456789abcdef
          STORAGE_DRIVER=mock
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
          REDIS_URL=redis://127.0.0.1:6379
          ENV

      - name: Apply migrations and seed the demo clinic
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install the Chromium browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: Playwright - every spec, every tag
        run: bash tools/ci/run-gate.sh e2e-full npm run e2e

      - name: Upload Playwright report, traces and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 30

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-evidence
          path: ci-evidence
          retention-days: 30

  backup-restore-drill:
    name: nightly recovery drill (backup, off-site, restore, smoke query)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      POSTGRES_USER: scalpai
      POSTGRES_PASSWORD: scalpai_dev_only
      POSTGRES_DB: scalpai
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      BACKUP_DIR: /tmp/scalpai-backups
      BACKUP_RETENTION_DAYS: "2"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: scalpai-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin-dev-only
      BACKUP_OFFSITE_ENDPOINT: http://127.0.0.1:9000
      BACKUP_OFFSITE_BUCKET: scalpai-ci-offsite
      BACKUP_OFFSITE_ACCESS_KEY: minioadmin
      BACKUP_OFFSITE_SECRET_KEY: minioadmin-dev-only
      BACKUP_OFFSITE_RETENTION_DAYS: "1"
      BACKUP_OFFSITE_LOCK_MODE: COMPLIANCE
      BACKUP_AGE_RECIPIENTS_FILE: /tmp/scalpai-secrets/recipients.txt
      BACKUP_AGE_IDENTITY_FILE: /tmp/scalpai-secrets/identity.txt
      DRILL_REPORT_HMAC_KEY_FILE: /tmp/scalpai-secrets/drill.key
      DRILL_REPORT_DIR: /tmp/scalpai-drills
      DRILL_ENVIRONMENT: nightly

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (private mirror fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install age, jq, mc and postgresql-client 17
        run: |
          # bounded retry for the pgdg/apt path (see tools/ci/retry.sh); `mc`
          # resolves through mc-wrapper.sh's retry + GHCR mirror fallback
          source tools/ci/retry.sh
          retry_cmd apt-source-install bash -c '
            sudo sh -c "echo \"deb http://apt.postgresql.org/pub/repos/apt \$(lsb_release -cs)-pgdg main\" > /etc/apt/sources.list.d/pgdg.list"
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq age jq postgresql-client-17
          '
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> "$GITHUB_ENV"
          install -m 0755 tools/ci/mc-wrapper.sh /usr/local/bin/mc

      - name: Generate the age keypair and the drill signing key
        run: |
          umask 077
          mkdir -p /tmp/scalpai-secrets
          age-keygen -o /tmp/scalpai-secrets/identity.txt 2> /tmp/scalpai-secrets/keygen.out
          grep -o 'age1[0-9a-z]*' /tmp/scalpai-secrets/keygen.out | head -n 1 > /tmp/scalpai-secrets/recipients.txt
          openssl rand -hex 32 > /tmp/scalpai-secrets/drill.key
          test -s /tmp/scalpai-secrets/recipients.txt

      - name: Start MinIO with a media bucket and an object-locked off-site bucket
        run: |
          # 2026-09-25: quay anonymous pulls are rate-limit flaky (this job
          # failed on main the night before). Pull with backoff + GHCR mirror
          # fallback (tools/ci/retry.sh, mirror synced by mirror-images.yml).
          source tools/ci/retry.sh
          retry_docker_pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run -d --name scalpai-minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin-dev-only \
            -v /tmp/minio-data:/data \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address 127.0.0.1:9000 > /tmp/minio.container-id
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::MinIO failed to start"; cat /tmp/minio.log; exit 1; fi
          export MC_HOST_local="http://minioadmin:minioadmin-dev-only@127.0.0.1:9000"
          mc mb --ignore-existing local/scalpai-ci
          mc mb --with-lock --ignore-existing local/scalpai-ci-offsite
          printf 'consent-signature-bytes' > /tmp/object.bin
          mc cp --quiet /tmp/object.bin local/scalpai-ci/clinic-a/consents/signature.bin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Backup both stores
        run: bash tools/ci/run-gate.sh backup-run bash ops/backup.sh

      - name: Backup freshness is within the RPO
        run: bash tools/ci/run-gate.sh backup-freshness bash ops/backup-freshness.sh

      - name: Off-site copy is complete and immutable
        run: bash tools/ci/run-gate.sh backup-offsite bash tools/ci/offsite-check.sh

      - name: Restore drill with checksums, smoke queries and a signed report
        run: bash tools/ci/run-gate.sh restore-drill bash ops/restore-drill.sh --use-latest

      - name: No PASS without the drill evidence
        if: always()
        run: npm run ci:gate:drill

      - name: Upload the signed drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-restore-drill-report
          path: /tmp/scalpai-drills
          retention-days: 90

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-drill-evidence
          path: ci-evidence
          retention-days: 30

  release-drill:
    name: nightly release drill (promote, attest, digest-pin, rollback, roll-forward)
    # ADR-0050: the rollback path is exercised EVERY NIGHT against a fresh
    # registry + stack, exactly like the CI deployment job does per PR - so a
    # regression in the release path can never hide between releases.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (private mirror fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # the rollback drill boots the full prod stack (`compose up --wait web
      # api` pulls minio through depends_on) — warm the flaky image first
      - name: Warm third-party images (MinIO pull is rate-limit flaky)
        run: |
          source tools/ci/retry.sh
          retry_docker_pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z

      - name: Write a complete secret set (generated on the runner, never committed)
        working-directory: ops
        run: |
          umask 077
          PHI_KEY=$(openssl rand -base64 32 | tr -d '\n')
          cat > ci.env <<ENV
          SCALPAI_DOMAIN=clinic.example.com
          ACME_EMAIL=admin@example.com
          POSTGRES_USER=scalpai_owner
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=scalpai
          APP_ROLE_PASSWORD=$(openssl rand -hex 16)
          MINIO_ROOT_USER=scalpai_admin
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          S3_BUCKET=scalpai-media
          JWT_SECRET=$(openssl rand -hex 32)
          PHI_KEY_RING=[{"kid":"k2026ci","key":"$PHI_KEY","state":"active","createdAt":"2026-09-09T00:00:00.000Z"}]
          ALERT_WEBHOOK_URL=http://127.0.0.1:9/alerts
          BACKUP_AGE_RECIPIENTS_FILE=/tmp/scalpai-recipients.txt
          BACKUP_OFFSITE_ENDPOINT=https://s3.provider.example
          BACKUP_OFFSITE_BUCKET=scalpai-offsite
          BACKUP_OFFSITE_ACCESS_KEY=$(openssl rand -hex 12)
          BACKUP_OFFSITE_SECRET_KEY=$(openssl rand -hex 16)
          ENV

      - name: Start a local OCI registry
        run: |
          docker run -d --name release-registry -p 127.0.0.1:5000:5000 registry:2.8.3
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Promote + attest two release channels from one build
        run: |
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/run-gate.sh release-promote \
            bash tools/ci/release-promote.sh --registry 127.0.0.1:5000 --tag "nightly-prod" --commit "$GITHUB_SHA"
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/run-gate.sh release-attest \
            bash tools/ci/release-attest.sh --tag "nightly-prod"
          SCALPAI_RELEASE_CHANNEL=staging SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/release-promote.sh --registry 127.0.0.1:5000 --tag "nightly-staging" --commit "$GITHUB_SHA"
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/release-attest.sh --tag "nightly-staging"

      - name: Digest-pin + full rollback drill on the real stack
        run: |
          bash tools/ci/run-gate.sh release-digest-pin \
            bash tools/ci/release-digest-pin.sh --tag "nightly-prod" --env-file "ops/ci.env"
          bash tools/ci/run-gate.sh release-drill \
            bash tools/ci/release-rollback-drill.sh --prod-tag "nightly-prod" --staging-tag "nightly-staging" --compose-env "ops/ci.env"

      - name: Tear down
        if: always()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env down -v

      - name: Upload the release ledger + attestations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-ledger
          path: |
            docs/releases/releases-ledger.jsonl
            ci-evidence/release-sbom-*.json
            ci-evidence/provenance-*.json
          retention-days: 30

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-release-evidence
          path: ci-evidence
          retention-days: 30
