# TEMPORARY (phase 4 review aid): one job per root gate so a red pipeline
# points at the exact gate. Deleted before merge.
name: diagnose

on:
  pull_request:
    branches: [main]

jobs:
  d-ops-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps
      - run: npm exec -- vitest run tools/ops/deployment.phase4.spec.ts

  d-image-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t scalpai-api:ci .

  d-image-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/web/Dockerfile -t scalpai-web:ci .

  d-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret set
        working-directory: ops
        run: |
          cat > ci.env <<'ENV'
          SCALPAI_DOMAIN=clinic.example.com
          ACME_EMAIL=admin@example.com
          POSTGRES_USER=scalpai_owner
          POSTGRES_PASSWORD=ci_dev_only_owner_pwd
          POSTGRES_DB=scalpai
          APP_ROLE_PASSWORD=ci_dev_only_app_pwd
          MINIO_ROOT_USER=scalpai_admin
          MINIO_ROOT_PASSWORD=ci_dev_only_minio_pwd
          S3_BUCKET=scalpai-media
          JWT_SECRET=ci_dev_only_secret_0123456789abcdef
          BACKUP_ENCRYPTION_PASSPHRASE=ci_dev_only_backup_passphrase
          ENV
      - name: Build images
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env build api web
      - name: Boot migrate + api + web from an empty volume
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env up -d --wait --wait-timeout 240 api web
      - name: Migration log
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env logs migrate
      - name: Diagnostics
        if: failure()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env ps -a && docker compose -f prod.yml --env-file ci.env logs --tail 300
      - name: Tear down
        if: always()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env down -v
