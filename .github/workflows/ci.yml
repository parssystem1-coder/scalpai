name: CI

# The retry/mirror helper (tools/ci/retry.sh) falls back to this namespace's
# GHCR package when quay.io rejects anonymous pulls.
env:
  GHCR_MIRROR_OWNER: ${{ github.repository_owner }}

# Phase 5 - CI/CD, tests and real gatekeeping (WEAKNESSES H14/H15/H16/M14/M15/M17/L1).
# Phase 9 adds the backup/restore gate (C10): the recovery path is executed, not
# described.
#
# Two rules govern this file:
#
#  1. NAMING: a job is named after the work it actually performs. No job called
#     "tests" that only lints, no "deploy" that only renders a template.
#  2. EVIDENCE (L1/W23): every gate runs through tools/ci/run-gate.sh, which
#     records the exact command, its full output and its exit code under
#     ci-evidence/<gate>.log. The final `gate` job re-checks those logs, so a
#     PASS can never be self-certified: a missing log fails the build exactly
#     like a failing command.
#
# npm is the only package manager on every executable surface (ADR-0036).

on:
  pull_request:
  push:
    branches: [main]

# A superseded push is dead work: cancel it instead of burning a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # pulls of the private ghcr.io/<owner>/mirror-minio fallback images (synced
  # by mirror-images.yml; GHCR packages start private)
  packages: read

jobs:
  lockfile:
    name: lockfile review (npm only, manifest and lock in lockstep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: package-lock.json is the contract (H16)
        run: bash tools/ci/run-gate.sh lockfile bash tools/ci/lockfile-review.sh

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-lockfile
          path: ci-evidence
          retention-days: 14

  verify:
    name: typecheck, lint, migrate, test+coverage, build, budget, conformance
    # Real Postgres (docker service on the runner), migrations from an empty DB,
    # integration suite with FORCE RLS. Phase 3 added a real Redis: the shared
    # throttle/entitlement state and the hand-rolled RESP client are proven
    # against a live server.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        # Pinned to the same minor as ops/dev.yml and ops/prod.yml (M17).
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      REDIS_TEST_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: scalpai-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin-dev-only
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (private mirror fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2026-09-25: three consecutive runs died here on quay.io anonymous-pull
      # rate limiting (and Nightly on main hit the same wall). Pull with
      # backoff + digest-mirror fallback (tools/ci/retry.sh, mirror synced by
      # mirror-images.yml) instead of a single doomed pull.
      - name: Start MinIO (ADR-0026 - same native-binary pattern as local dev)
        run: |
          source tools/ci/retry.sh
          retry_docker_pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run -d --name scalpai-minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin-dev-only \
            -v /tmp/minio-data:/data \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address 127.0.0.1:9000 > /tmp/minio.container-id
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::MinIO failed to start"; cat /tmp/minio.log; exit 1; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # H16: the lockfile is the contract. No fallback that would silently
      # resolve fresh versions when the lockfile drifts.
      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Type check every workspace (turbo)
        run: bash tools/ci/run-gate.sh typecheck npm run typecheck

      - name: Lint
        run: bash tools/ci/run-gate.sh lint npm run lint

      - name: Apply migrations from an empty database (proof)
        run: bash tools/ci/run-gate.sh db-migrate npm run db:migrate

      - name: Seed demo data
        run: bash tools/ci/run-gate.sh db-seed npm run db:seed

      - name: Unit + integration tests with coverage thresholds (real PG + Redis)
        run: bash tools/ci/run-gate.sh test-coverage npm run test:coverage

      - name: Build every workspace (turbo)
        run: bash tools/ci/run-gate.sh build npm run build

      # M15b: the ceiling comes from the COMMITTED policy, not from an
      # environment variable a step could raise. the gate wrapper records the command,
      # the full output and the exit code, and the final `gate` job re-reads it.
      - name: Enforce bundle budget from the committed policy (M15b)
        run: >
          bash tools/ci/run-gate.sh bundle-budget
          npm run budget:bundle -- --policy tools/bundle-budget.policy.json

      - name: Reject sample data from the production artifact (M1d)
        run: bash tools/ci/run-gate.sh production-stripping npm run production:strip

      - name: Conformance harness (ADR-21)
        run: bash tools/ci/run-gate.sh conformance npm run conformance

      - name: Project graph up to date (ADR-22)
        run: bash tools/ci/run-gate.sh graph npm run graph -- --check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14

      # The measured report is an artifact (dist/ is gitignored); the policy it
      # was judged against is committed. Keeping both together makes the verdict
      # reproducible from the artifact alone.
      - name: Upload the bundle budget report and the policy it was judged against
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget
          path: |
            apps/web/dist/bundle-budget.report.json
            apps/web/dist/production-stripping.report.json
            tools/bundle-budget.policy.json
          retention-days: 14

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verify
          path: ci-evidence
          retention-days: 14

  security:
    name: dependency audit + repository secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Runtime dependencies carry no high or critical advisory (H14)
        run: bash tools/ci/run-gate.sh audit npm run audit:ci

      - name: Secret scan over every tracked file (H14/M7)
        run: bash tools/ci/run-gate.sh secret-scan npm run scan:secrets

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-security
          path: ci-evidence
          retention-days: 14

  e2e-smoke:
    name: browser @smoke against the real API + web stack
    # H15: the golden path runs on every PR. The full tagged suite
    # (offline / analysis / upload-big / perf) runs nightly.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      API_PORT: "3001"
      WEB_PORT: "5173"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      # The API entrypoint reads the repo .env through loadEnv (ADR-0024), so the
      # server Playwright starts gets exactly this configuration.
      - name: Write the .env the API under test boots with
        run: |
          cat > .env <<'ENV'
          NODE_ENV=test
          PORT=3001
          MIGRATE_DATABASE_URL=postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
          DATABASE_URL=postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
          APP_ROLE_PASSWORD=scalpai_dev_only
          JWT_SECRET=ci_dev_only_secret_0123456789abcdef
          STORAGE_DRIVER=mock
          CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
          REDIS_URL=redis://127.0.0.1:6379
          ENV

      - name: Apply migrations and seed the demo clinic
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Install the Chromium browser Playwright drives
        run: npx playwright install --with-deps chromium

      - name: Playwright @smoke (login, create patient, persistence, see it listed)
        run: bash tools/ci/run-gate.sh e2e-smoke npm run e2e:smoke
        env:
          # The auto-lock e2e waits out a REAL idle window (VITE_AUTO_LOCK_SECONDS
          # is an e2e-only escape hatch; the production build keeps the §13 600s
          # window). 15s stays far above sibling smoke specs' inter-action gaps
          # (so their steps never trip the lock) and far below the test timeout.
          E2E_AUTO_LOCK_SECONDS: "15"
          VITE_AUTO_LOCK_SECONDS: "15"

      - name: no-synthetic-clinical
        run: bash tools/ci/run-gate.sh no-synthetic-clinical npx tsx tools/quality/no-synthetic-clinical.ts

      - name: locale-parity
        run: bash tools/ci/run-gate.sh locale-parity npx tsx tools/quality/locale-parity.ts

      # Wave 4 (C9/F07): focus trap/restore/Escape live in the shared primitive,
      # every modal mounts through it, no *Modal.tsx remains outside modals/.
      - name: a11y-dialog
        run: bash tools/ci/run-gate.sh a11y-dialog npx vitest run apps/web/src/components/modals/__tests__/dialog-a11y.spec.tsx

      # Wave 4 (C1/C2): the dashboard renders real provider data - no synthetic
      # roster, no fabricated metrics.
      - name: dashboard-integration
        run: bash tools/ci/run-gate.sh dashboard-integration npx vitest run apps/web/src/__tests__/ClinicalDashboard.integration.spec.tsx

      - name: auto-lock-coverage
        run: bash tools/ci/run-gate.sh auto-lock-coverage npx tsx tools/quality/auto-lock-coverage.ts

      # C12/F20 (wave 4): the hologram ttfr measurement itself is the gate. The
      # web+API stack from the @smoke steps above is still up, so the targeted
      # spec runs without a second stack boot - the measurement must exist and
      # stay under the COMMITTED baseline (no env-var ceiling).
      - name: perf-baseline (hologram ttfr vs the committed baseline)
        run: bash tools/ci/run-gate.sh perf-baseline npx playwright test e2e/perf.hologram.spec.ts

      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-e2e-smoke
          path: ci-evidence
          retention-days: 14

  backup-restore:
    name: encrypted backup of both stores + verified restore drill (C10)
    # Phase 9 (ADR-0042). The previous pipeline was never executed by anything:
    # `pg_dump` alone, CBC without integrity, no off-site copy and no restore.
    # This job runs the real scripts against a real Postgres and a real MinIO
    # with object locking, then restores into a scratch database and asserts the
    # data is there. It also proves the off-site copy CANNOT be deleted.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      POSTGRES_USER: scalpai
      POSTGRES_PASSWORD: scalpai_dev_only
      POSTGRES_DB: scalpai
      DB_HOST: 127.0.0.1
      DB_PORT: "5433"
      BACKUP_DIR: /tmp/scalpai-backups
      BACKUP_RETENTION_DAYS: "2"
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: scalpai-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin-dev-only
      BACKUP_OFFSITE_ENDPOINT: http://127.0.0.1:9000
      BACKUP_OFFSITE_BUCKET: scalpai-ci-offsite
      BACKUP_OFFSITE_ACCESS_KEY: scalpai_offsite_dev_only
      BACKUP_OFFSITE_SECRET_KEY: offsite-append-only-dev-only
      BACKUP_OFFSITE_RETENTION_DAYS: "1"
      BACKUP_OFFSITE_LOCK_MODE: COMPLIANCE
      BACKUP_AGE_RECIPIENTS_FILE: /tmp/scalpai-secrets/recipients.txt
      BACKUP_AGE_IDENTITY_FILE: /tmp/scalpai-secrets/identity.txt
      DRILL_REPORT_HMAC_KEY_FILE: /tmp/scalpai-secrets/drill.key
      DRILL_REPORT_DIR: /tmp/scalpai-drills
      DRILL_ENVIRONMENT: ci

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR (private mirror fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install age, jq, mc and postgresql-client 17
        run: |
          source tools/ci/retry.sh
          retry_cmd apt-source-install bash -c '
            sudo sh -c "echo \"deb http://apt.postgresql.org/pub/repos/apt \$(lsb_release -cs)-pgdg main\" > /etc/apt/sources.list.d/pgdg.list"
            curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
            sudo apt-get update -qq
            sudo apt-get install -y -qq age jq postgresql-client-17
          '
          echo "PATH=/usr/lib/postgresql/17/bin:$PATH" >> "$GITHUB_ENV"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          install -m 0755 tools/ci/mc-wrapper.sh /usr/local/bin/mc
          age --version && pg_dump --version && mc --version

      # The recipients file is PUBLIC, the identity is generated here and never
      # leaves the runner - exactly the split ops/prod.env.template describes.
      - name: Generate the age keypair and the drill signing key
        run: |
          umask 077
          mkdir -p /tmp/scalpai-secrets
          age-keygen -o /tmp/scalpai-secrets/identity.txt 2> /tmp/scalpai-secrets/keygen.out
          grep -o 'age1[0-9a-z]*' /tmp/scalpai-secrets/keygen.out | head -n 1 > /tmp/scalpai-secrets/recipients.txt
          openssl rand -hex 32 > /tmp/scalpai-secrets/drill.key
          test -s /tmp/scalpai-secrets/recipients.txt

      - name: Start MinIO with a media bucket and an OBJECT-LOCKED off-site bucket
        run: |
          source tools/ci/retry.sh
          retry_docker_pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          docker run -d --name scalpai-minio --network host \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin-dev-only \
            -v /tmp/minio-data:/data \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address 127.0.0.1:9000 > /tmp/minio.container-id
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::MinIO failed to start"; cat /tmp/minio.log; exit 1; fi
          export MC_HOST_local="http://minioadmin:minioadmin-dev-only@127.0.0.1:9000"
          mc mb --ignore-existing local/scalpai-ci
          mc mb --with-lock --ignore-existing local/scalpai-ci-offsite
          bash tools/ci/offsite-worm-setup.sh
          printf 'consent-signature-bytes' > /tmp/object.bin
          mc cp --quiet /tmp/object.bin local/scalpai-ci/clinic-a/consents/signature.bin
          mc cp --quiet /tmp/object.bin local/scalpai-ci/clinic-a/gallery/photo.bin

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Migrate and seed, so the drill has real rows to find
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Encrypted backup of Postgres AND MinIO, pushed off-site
        run: bash tools/ci/run-gate.sh backup-run bash ops/backup.sh

      - name: Backup freshness is within the RPO
        run: bash tools/ci/run-gate.sh backup-freshness bash ops/backup-freshness.sh

      - name: The off-site copy exists and is immutable (negative proof)
        run: bash tools/ci/run-gate.sh backup-offsite bash tools/ci/offsite-check.sh

      - name: Restore into a scratch database, verify checksums and smoke-query it
        run: bash tools/ci/run-gate.sh restore-drill bash ops/restore-drill.sh --use-latest

      - name: The backup image really builds (age, mc, jq baked in)
        working-directory: ops
        run: |
          umask 077
          PHI_KEY=$(openssl rand -base64 32 | tr -d '\n')
          cat > ci.env <<ENV
          SCALPAI_DOMAIN=clinic.example.com
          ACME_EMAIL=admin@example.com
          POSTGRES_USER=scalpai_owner
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=scalpai
          APP_ROLE_PASSWORD=$(openssl rand -hex 16)
          MINIO_ROOT_USER=scalpai_admin
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          S3_BUCKET=scalpai-media
          JWT_SECRET=$(openssl rand -hex 32)
          PHI_KEY_RING=[{"kid":"k2026ci","key":"$PHI_KEY","state":"active","createdAt":"2026-09-09T00:00:00.000Z"}]
          ALERT_WEBHOOK_URL=http://127.0.0.1:9/alerts
          BACKUP_AGE_RECIPIENTS_FILE=/tmp/scalpai-secrets/recipients.txt
          BACKUP_OFFSITE_ENDPOINT=http://127.0.0.1:9000
          BACKUP_OFFSITE_BUCKET=scalpai-ci-offsite
          BACKUP_OFFSITE_ACCESS_KEY=minioadmin
          BACKUP_OFFSITE_SECRET_KEY=minioadmin-dev-only
          ENV
          bash ../tools/ci/run-gate.sh backup-image docker compose -f prod.yml --env-file ci.env build backup-cron

      - name: Upload the signed drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report
          path: /tmp/scalpai-drills
          retention-days: 90

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-backup-restore
          path: ci-evidence
          retention-days: 14

  deployment:
    name: build images, scan them, boot the self-hosted stack
    # Phase 4 (C8/M17/R10) proof, extended with the phase 5 image scan: images
    # must really build, compose must refuse a missing secret, migrate + api +
    # web must come up on an empty volume, and what was built gets scanned.
    runs-on: ubuntu-latest
    env:
      CI_EVIDENCE_DIR: ${{ github.workspace }}/ci-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Write a complete secret set (generated on the runner, never committed)
        working-directory: ops
        run: |
          umask 077
          PHI_KEY=$(openssl rand -base64 32 | tr -d '\n')
          cat > ci.env <<ENV
          SCALPAI_DOMAIN=clinic.example.com
          ACME_EMAIL=admin@example.com
          POSTGRES_USER=scalpai_owner
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          POSTGRES_DB=scalpai
          APP_ROLE_PASSWORD=$(openssl rand -hex 16)
          MINIO_ROOT_USER=scalpai_admin
          MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)
          S3_BUCKET=scalpai-media
          JWT_SECRET=$(openssl rand -hex 32)
          PHI_KEY_RING=[{"kid":"k2026ci","key":"$PHI_KEY","state":"active","createdAt":"2026-09-09T00:00:00.000Z"}]
          ALERT_WEBHOOK_URL=http://127.0.0.1:9/alerts
          BACKUP_AGE_RECIPIENTS_FILE=/tmp/scalpai-recipients.txt
          BACKUP_OFFSITE_ENDPOINT=https://s3.provider.example
          BACKUP_OFFSITE_BUCKET=scalpai-offsite
          BACKUP_OFFSITE_ACCESS_KEY=$(openssl rand -hex 12)
          BACKUP_OFFSITE_SECRET_KEY=$(openssl rand -hex 16)
          ENV
          printf '%s\n' 'age1ci0000000000000000000000000000000000000000000000000000000' > /tmp/scalpai-recipients.txt

      - name: prod.yml and dev.yml render with a full secret set
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh compose-config bash -c 'docker compose -f prod.yml --env-file ci.env config -q && docker compose -f dev.yml config -q'

      - name: prod.yml REFUSES a missing secret set (negative proof)
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh compose-secrets-negative bash -c 'if docker compose -f prod.yml config -q 2>/dev/null; then echo "::error::prod.yml accepted an empty secret set"; exit 1; fi; echo "compose correctly refused to render without secrets"'

      - name: Build api + web images (lockfile, native modules, turbo)
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh docker-build docker compose -f prod.yml --env-file ci.env build api web

      - name: Scan the images that were just built (M17)
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh image-scan bash ../tools/ci/image-scan.sh api web

      # 2026-09-25: `up --wait` failed three runs in a row because the MinIO
      # pull inside `up` is not retried by compose. Warm the local image cache
      # first with the retry+mirror helper; the `up` below then finds the
      # image present and never needs the registry.
      - name: Log in to GHCR (private mirror fallback)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm third-party images (MinIO pull is rate-limit flaky)
        working-directory: ops
        run: |
          # minio (compose `up` dep) + mc (backup-cron build's FROM) — both are
          # quay.io pins that anonymous pulls reject under rate limiting
          source ../tools/ci/retry.sh
          retry_docker_pull quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          retry_docker_pull quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z

      - name: Boot from an empty database (migration gate + healthy API)
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh stack-boot docker compose -f prod.yml --env-file ci.env up -d --wait --wait-timeout 240 api web

      # ---- Wave 5 (C6/P4-B06, ADR-0050): the release path is enforced here ----
      # A LOCAL OCI registry: fork PRs never get GHCR credentials, and the
      # promotion contract must be exercisable on every PR (dependabot runs too).
      # release.yml does the identical flow against GHCR on main.
      - name: Start a local OCI registry for the promotion
        run: |
          docker run -d --name release-registry --restart always -p 127.0.0.1:5000:5000 registry:2.8.3
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/v2/ >/dev/null 2>&1; then break; fi
            sleep 1
          done

      - name: Promote the digests CI built (build once, push by digest)
        run: |
          echo "127.0.0.1 release-registry" | sudo tee -a /etc/hosts
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/run-gate.sh release-promote \
            bash tools/ci/release-promote.sh --registry 127.0.0.1:5000 --tag "ci-${GITHUB_SHA::12}" --commit "$GITHUB_SHA"

      - name: SBOM + provenance for the promoted digests
        run: |
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/run-gate.sh release-attest \
            bash tools/ci/release-attest.sh --tag "ci-${GITHUB_SHA::12}"

      - name: Pin prod.yml to the promoted digests (tags never deploy)
        run: |
          bash tools/ci/run-gate.sh release-digest-pin \
            bash tools/ci/release-digest-pin.sh --tag "ci-${GITHUB_SHA::12}" --env-file "ops/ci.env"

      - name: Rollback drill - boot prod digest, promote staging digest, roll back, roll forward
        run: |
          STAGING_TAG="staging-${GITHUB_SHA::12}"
          SCALPAI_RELEASE_CHANNEL=staging SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/release-promote.sh --registry 127.0.0.1:5000 --tag "$STAGING_TAG" --commit "$GITHUB_SHA"
          SCALPAI_RELEASE_REGISTRY=127.0.0.1:5000 \
            bash tools/ci/release-attest.sh --tag "$STAGING_TAG"
          bash tools/ci/run-gate.sh release-drill \
            bash tools/ci/release-rollback-drill.sh --prod-tag "ci-${GITHUB_SHA::12}" --staging-tag "$STAGING_TAG" --compose-env "ops/ci.env"

      - name: The release runbook refuses an out-of-order path (negative proof)
        run: |
          # ci-* and staging-* were attested two steps ago, so deploying either
          # cannot prove the fail-closed path (CI run 35730525315 failed here
          # with "unexpected runbook failure": compose then tried ops/prod.env).
          # Seed a promote-only ledger line - the same fixture the unit spec uses.
          UNATTESTED_TAG="unattested-${GITHUB_SHA::12}"
          printf '{"ts":"%s","kind":"promote","commit":"%s","tag":"%s","registry":"local","api":"local/scalpai-api@sha256:%s","web":"local/scalpai-web@sha256:%s"}\n' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" "$UNATTESTED_TAG" \
            "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb" \
            >> docs/releases/releases-ledger.jsonl
          if bash tools/ci/release-runbook.sh deploy "$UNATTESTED_TAG" 2>runbook.err; then
            echo "::error::runbook deployed without attestation gating"; cat runbook.err; exit 1
          fi
          grep -q "not attested" runbook.err || { echo "::error::unexpected runbook failure"; cat runbook.err; exit 1; }
          # Latest promote is now the unattested tag; roll back to the ci (prod) tag.
          bash tools/ci/run-gate.sh release-runbook \
            bash tools/ci/release-runbook.sh rollback "ci-${GITHUB_SHA::12}"

      - name: Upload the release ledger + attestations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-ledger
          path: |
            docs/releases/releases-ledger.jsonl
            ci-evidence/release-sbom-*.json
            ci-evidence/provenance-*.json
          retention-days: 90

      - name: Migration ran exactly once, as the owner role
        working-directory: ops
        run: >
          bash ../tools/ci/run-gate.sh migrate-once bash -c
          'docker compose -f prod.yml --env-file ci.env logs migrate &&
          docker compose -f prod.yml --env-file ci.env logs migrate |
          grep -q "migrate: applied="'

      - name: API answers on its own health and readiness routes
        working-directory: ops
        run: bash ../tools/ci/run-gate.sh api-health docker compose -f prod.yml --env-file ci.env exec -T api node -e "Promise.all([fetch('http://127.0.0.1:3000/api/v1/health').then(r=>r.json()),fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>r.json())]).then(([h,r])=>{console.log(JSON.stringify({h,r}));process.exit(h.ok&&r.ok?0:1)}).catch(e=>{console.error(e);process.exit(1)})"

      - name: Diagnostics on failure
        if: failure()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env ps -a && docker compose -f prod.yml --env-file ci.env logs --tail 200

      - name: Tear down
        if: always()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env down -v

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-deployment
          path: ci-evidence
          retention-days: 14

  gate:
    name: gate report (no PASS without a command log)
    # L1/W23: this is the only job allowed to say PASS, and it says it by reading
    # the recorded evidence of every other gate - never by trusting a green
    # checkmark. It runs even when an upstream job failed, so the summary always
    # names what was missing or red.
    if: always()
    needs: [lockfile, verify, security, e2e-smoke, backup-restore, deployment]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Collect the evidence of every job
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: ci-evidence
          merge-multiple: true

      - name: Every required gate has a log with exit=0
        run: npm run ci:gate

      - name: Upload the merged evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: ci-evidence
          retention-days: 30
