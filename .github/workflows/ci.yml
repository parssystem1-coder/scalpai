name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base:
    # Phase 1: real Postgres (docker service on runner), migrations from
    # empty DB, integration suite with FORCE RLS, guardrails (§14.2/14.3).
    # Phase 3 adds a real Redis: the shared throttle/entitlement/rate-limit
    # state and the hand-rolled RESP client are proven against a live server.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        # Pinned to the same minor as ops/dev.yml and ops/prod.yml (M17).
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef
      REDIS_TEST_URL: redis://127.0.0.1:6379
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: scalpai-ci
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin-dev-only
      S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Start MinIO (ADR-0026 — same native-binary pattern as local dev)
        run: |
          curl -fsSL -o /usr/local/bin/minio https://dl.min.io/server/minio/release/linux-amd64/minio
          chmod +x /usr/local/bin/minio
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin-dev-only \
            nohup /usr/local/bin/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "::error::MinIO failed to start"; cat /tmp/minio.log; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # H16: the lockfile is the contract. No fallback that would silently
      # resolve fresh versions when the lockfile drifts.
      - name: Install dependencies (npm ci, lockfile enforced)
        run: npm ci --legacy-peer-deps

      - name: Type check (every workspace, via turbo)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply migrations from empty database (proof)
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

      - name: Unit + integration tests + coverage gate >=70% (RLS / cross-tenant on real PG)
        run: npm run test:coverage

      - name: Build all workspaces (turbo)
        run: npm run build

      - name: Bundle budget (web <300KB gzip)
        run: npm run budget:bundle

      - name: Conformance harness (ADR-21)
        run: npm run conformance

      - name: Project graph up to date (ADR-22)
        run: npm run graph -- --check

  deployment:
    # Phase 4 (C8/M17/R10): the self-hosted stack is proven, not asserted.
    # Images must really build, compose must refuse a missing secret, and
    # migrate + api + web must come up on an empty volume.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write a complete secret set
        working-directory: ops
        run: |
          cat > ci.env <<'ENV'
          SCALPAI_DOMAIN=clinic.example.com
          ACME_EMAIL=admin@example.com
          POSTGRES_USER=scalpai_owner
          POSTGRES_PASSWORD=ciOwnerPwd7Rq2XmT9
          POSTGRES_DB=scalpai
          APP_ROLE_PASSWORD=ciAppPwd4Kd8ZbV3Ns
          MINIO_ROOT_USER=scalpai_admin
          MINIO_ROOT_PASSWORD=ciMinioPwd6Hf1QcY5
          S3_BUCKET=scalpai-media
          JWT_SECRET=9f14c7a35b8e02d6417ac9b53e8f21d0c46b7a9e3512f8d0ab74c6e19d2537f8
          BACKUP_ENCRYPTION_PASSPHRASE=ciBackupPass2Wm9Tz
          ENV

      - name: prod.yml is valid with a full secret set
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env config -q

      - name: prod.yml REFUSES a missing secret set (negative proof)
        working-directory: ops
        run: |
          if docker compose -f prod.yml config -q 2>/dev/null; then
            echo "::error::prod.yml accepted an empty secret set"; exit 1
          fi
          echo "compose correctly refused to render without secrets"

      - name: dev.yml is valid
        run: docker compose -f ops/dev.yml config -q

      - name: Build api + web images (lockfile install, native modules, turbo)
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env build api web

      - name: Boot from an empty database (migration gate + healthy API)
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env up -d --wait --wait-timeout 240 api web

      - name: Migration ran exactly once, as the owner role
        working-directory: ops
        run: |
          docker compose -f prod.yml --env-file ci.env logs migrate
          docker compose -f prod.yml --env-file ci.env logs migrate | grep -q "migrate: applied="

      - name: API answers on its own health route
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env exec -T api node -e "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.ok?0:1)})"

      - name: Diagnostics on failure
        if: failure()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env ps -a && docker compose -f prod.yml --env-file ci.env logs --tail 200

      - name: Tear down
        if: always()
        working-directory: ops
        run: docker compose -f prod.yml --env-file ci.env down -v
