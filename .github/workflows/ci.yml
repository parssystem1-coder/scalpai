name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base:
    # Phase 1: real Postgres (docker service on runner), migrations from
    # empty DB, integration suite with FORCE RLS, guardrails (§14.2/14.3).
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scalpai
          POSTGRES_PASSWORD: scalpai_dev_only
          POSTGRES_DB: scalpai
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U scalpai"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MIGRATE_DATABASE_URL: postgresql://scalpai:scalpai_dev_only@localhost:5433/scalpai
      DATABASE_URL: postgresql://scalpai_app:scalpai_dev_only@localhost:5433/scalpai
      APP_ROLE_PASSWORD: scalpai_dev_only
      JWT_SECRET: ci_dev_only_secret_0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply migrations from empty database (proof)
        run: pnpm db:migrate

      - name: Seed demo data
        run: pnpm db:seed

      - name: Unit + integration tests (RLS / cross-tenant on real PG)
        run: pnpm test

      - name: Build all workspaces
        run: pnpm build

      - name: Conformance harness (ADR-21)
        run: pnpm conformance

      - name: Project graph up to date (ADR-22)
        run: pnpm graph -- --check
