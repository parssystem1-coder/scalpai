# CI — نگهبان خودکار کیفیت ScalpAI
# -----------------------------------------------------------------------
# چرا این فایل حیاتی است؟
#   قرارداد «پایان هر فاز» در مستندات پروژه، اجرای دستی `pnpm verify` را
#   الزامی می‌کرد. در عمل چند فاز «انجام‌شده» علامت خوردند در حالی که
#   بخش‌هایی از آن‌ها هرگز وارد مخزن نشده بودند. علتش این بود که هیچ
#   سیستمی ادعای سند را در برابر واقعیت کد نمی‌سنجید.
#   از این پس، «انجام شد» یعنی «CI سبز است» — نه یک جدول در markdown.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# اگر کامیت جدیدی روی همان برنچ آمد، اجرای قبلی لغو شود (صرفه‌جویی در زمان CI)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: تایپ‌چک، لینت، تست و بیلد
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب pnpm
        uses: pnpm/action-setup@v4
        with:
          # نسخه از فیلد packageManager در package.json خوانده می‌شود
          run_install: false

      - name: راه‌اندازی Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: نصب وابستگی‌ها
        # --frozen-lockfile: اگر lockfile با package.json نخواند، همین‌جا شکست
        # می‌خورد به‌جای اینکه بی‌صدا نسخهٔ دیگری نصب شود.
        # --ignore-scripts: better-sqlite3 نیازی به کامپایل native در CI ندارد؛
        # تست قرارداد دیتابیس هر دو موتور (SQLite و JSON) را پوشش می‌دهد و
        # اگر ماژول native نباشد، مسیر JSON آزموده می‌شود.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: تایپ‌چک TypeScript
        run: pnpm exec tsc -b

      - name: لینت
        run: pnpm exec eslint .

      - name: تست‌های واحد
        run: pnpm exec vitest run

      - name: قرارداد دیتابیس (هر دو موتور)
        run: node scripts/test-db-contract.cjs

      - name: کنترلر به‌روزرسانی خودکار (موج ۳)
        run: node scripts/test-updater.cjs

      - name: استریم و پروفایل حافظهٔ بکاپ (موج ۳)
        run: node --expose-gc scripts/test-backup-stream.cjs

      - name: قفل نسخه و CHANGELOG (موج ۳)
        run: node scripts/check-changelog-version.cjs

      - name: همگامی ثابت‌های مشترک TS و Python
        # نگهبان اینکه موتور مرورگر و موتور Python روی یک تصویر نتیجهٔ
        # متفاوت ندهند — چون fallback بین دو موتور خودکار و بی‌صداست.
        run: node scripts/check-shared-constants.cjs

      - name: دارایی‌های بستهٔ نصبی
        # بررسی می‌کند هر ارجاع build/* در electron-builder.json واقعاً
        # قابل تولید و ساختاراً معتبر باشد.
        run: node scripts/test-build-assets.cjs

      - name: بیلد نسخهٔ production
        run: pnpm run build

  # ساخت واقعی بستهٔ نصبی — گران‌تر است، پس فقط روی درخواست دستی یا تگ.
  # هدف: کشف زودهنگام خطاهایی که فقط در زمان بسته‌بندی ظاهر می‌شوند.
  package:
    name: ساخت بستهٔ نصبی (ویندوز)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: نصب وابستگی‌ها
        run: pnpm install --frozen-lockfile

      - name: ساخت نصب‌کنندهٔ ویندوز
        run: pnpm run electron:build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: بارگذاری خروجی
        uses: actions/upload-artifact@v4
        with:
          name: scalpai-windows
          path: |
            release/*.exe
          if-no-files-found: error
          retention-days: 14
